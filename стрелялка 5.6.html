<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Стрелялка с усилениями и ограничениями</title>
<style>
  html, body {
  touch-action: none;
  overscroll-behavior: none;
}
body {
    margin: 0;
    background: #111;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
    -webkit-user-select: none;
    font-family: monospace, monospace;
  }
  canvas {
    background: #222;
    border: 2px solid #555;
    touch-action: none;
  }
  #score {
    color: #eee;
    font-size: 24px;
    margin-top: 10px;
  }
  #lives {
    color: #f00;
    font-size: 24px;
    margin-top: 5px;
  }
  #controls {
    margin-top: 15px;
    width: 100%;
    max-width: 600px;
    display: flex;
    justify-content: space-around;
  }
  button.control-btn {
    width: 30%;
    padding: 15px 0;
    font-size: 20px;
    border: none;
    border-radius: 10px;
    background: #444;
    color: #eee;
    user-select: none;
  }
  button.control-btn:active {
    background: #666;
  }
  #restartBtn {
    margin-top: 70px;
    padding: 10px 30px;
    font-size: 20px;
    border: none;
    border-radius: 10px;
    background: #2196F3;
    color: white;
    cursor: pointer;
    user-select: none;
  }
  #restartBtn:hover {
    background: #1976D2;
  }
  #powerupOverlay {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    min-width: 350px;
    max-width: 90vw;
    background: rgba(0,0,0,0.9);
    border-radius: 15px;
    color: white;
    font-size: 20px;
    padding: 25px 30px;
    z-index: 1000;
    display: none;
    box-sizing: border-box;
    box-shadow: 0 0 15px #2196F3;
  }
  #powerupOverlay h2 {
    margin: 0 0 20px 0;
    text-align: center;
  }
  #powerupOptions {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
  }
  .powerupBtn {
    background: #333;
    padding: 15px 20px;
    border-radius: 12px;
    cursor: pointer;
    border: 2px solid transparent;
    width: 240px;
    user-select: none;
    transition: border-color 0.3s, background-color 0.3s;
    font-size: 16px;
  }
  .powerupBtn:hover {
    border-color: #2196F3;
  }
  .powerupBtn.disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .powerupBtn.selected {
    border-color: #4CAF50;
    background: #265f27;
  }
  #powerupButtonsContainer {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    gap: 20px;
  }
  #confirmPowerupBtn, #skipPowerup {
    padding: 10px 20px;
    font-size: 18px;
    border-radius: 12px;
    background: #2196F3;
    color: white;
    cursor: pointer;
    user-select: none;
    border: none;
    transition: background-color 0.3s;
    min-width: 120px;
  }
  #confirmPowerupBtn:disabled {
    background: #555;
    cursor: not-allowed;
  }
  #confirmPowerupBtn:hover:not(:disabled),
  #skipPowerup:hover {
    background: #1976D2;
  }

  /* Leaderboard */
  #leaderboard {
    margin-top: 12px;
    width: 100%;
    max-width: 320px;
    background: #1b1b1b;
    border: 2px solid #333;
    border-radius: 12px;
    padding: 12px;
    box-sizing: border-box;
    font-size: 16px;
  }
  #leaderboard h3 {
    margin: 0 0 8px 0;
    text-align: center;
  }
  #scoresList {
    list-style: none;
    padding: 0;
    margin: 0;
    max-height: 200px;
    overflow:auto;
  }
  #scoresList li {
    display:flex;
    justify-content:space-between;
    padding:4px 8px;
    border-radius:6px;
    margin-bottom:4px;
    background:#111;
    font-size: 14px;
    color: white;
}
  #clearScoresBtn {
    margin-top:8px;
    width:100%;
    padding:6px;
    border-radius:8px;
    border:none;
    background:#b71c1c;
    color:white;
    cursor:pointer;
    font-size: 14px;
  }
  #clearScoresBtn:hover { background:#7f0f0f; }
</style>
</head>
<body>
<canvas id="game" width="600" height="800"></canvas>
<div id="score">Очки: 0</div>
<div id="lives">❤❤❤</div>
<div id="controls">
  <button id="leftBtn" class="control-btn">← Влево</button>
  <button id="shootBtn" class="control-btn">Стрелять</button>
  <button id="rightBtn" class="control-btn">Вправо →</button>
</div>
<button id="restartBtn">Рестарт</button>
<div id="leaderboard">
  <h3>Рекорды — Топ-5</h3>
  <ul id="scoresList"></ul>
  <button id="clearScoresBtn">Сбросить рекорды</button>
</div>


<div id="powerupOverlay">
  <h2>Выбери усиление (100 очков)</h2>
  <div id="powerupOptions"></div>
  <div id="powerupButtonsContainer">
    <button id="confirmPowerupBtn" disabled>Подтвердить выбор</button>
    <button id="skipPowerup">Пропустить</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const player = {
  x: canvas.width / 2 - 45,
  y: canvas.height - 60,
  width: 90,
  height: 40,
  speed: 10,
  dx: 0
};

const bullets = [];
const enemies = [];
const enemySize = 40;
let enemySpawnInterval = 1500;
let lastEnemySpawn = 0;
let score = 0;
let lives = 3;
let gameOver = false;

let lastShotTime = 0;
let shotCooldown = 400;

let powerups = {
  bulletSizeMultiplier: 2,
  shotCooldownMultiplier: 1,
  multishotLevel: 0
};

let lastPowerupTime = performance.now();
const powerupInterval = 20000;

const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if(e.code === 'Space') shoot();
});
document.addEventListener('keyup', e => {
  keys[e.code] = false;
});

const leftBtn = document.getElementById('leftBtn');
const rightBtn = document.getElementById('rightBtn');
const shootBtn = document.getElementById('shootBtn');

let leftPressed = false;
let rightPressed = false;

leftBtn.addEventListener('touchstart', e => { e.preventDefault(); leftPressed = true; });
leftBtn.addEventListener('touchend', e => { e.preventDefault(); leftPressed = false; });

rightBtn.addEventListener('touchstart', e => { e.preventDefault(); rightPressed = true; });
rightBtn.addEventListener('touchend', e => { e.preventDefault(); rightPressed = false; });

shootBtn.addEventListener('touchstart', e => { e.preventDefault(); shoot(); });

document.getElementById('restartBtn').addEventListener('click', restartGame);

const powerupOverlay = document.getElementById('powerupOverlay');
const powerupOptionsDiv = document.getElementById('powerupOptions');
const skipPowerupBtn = document.getElementById('skipPowerup');
const confirmPowerupBtn = document.getElementById('confirmPowerupBtn');

let selectedPowerupId = null;

skipPowerupBtn.addEventListener('click', () => {
  selectedPowerupId = null;
  powerupOverlay.style.display = 'none';
  lastPowerupTime = performance.now();
  lastTime = performance.now(); // сброс времени при выходе
  gamePaused = false;
});

confirmPowerupBtn.addEventListener('click', () => {
  if(selectedPowerupId === null || score < 100) return;
  score -= 100;
  document.getElementById('score').textContent = 'Очки: ' + score;

  const chosen = powerupList.find(p => p.id === selectedPowerupId);
  if(chosen) {
    chosen.apply();
  }

  selectedPowerupId = null;
  powerupOverlay.style.display = 'none';
  confirmPowerupBtn.disabled = true;
  lastPowerupTime = performance.now();
  lastTime = performance.now(); // сброс времени при выходе
  gamePaused = false;
});

const powerupList = [
  { id: 'bulletSize', name: 'Увеличение размера снаряда', desc: 'Снаряды становятся на 50% больше', apply() { powerups.bulletSizeMultiplier *= 1.5; } },
  { id: 'extraLife', name: 'Дополнительная жизнь', desc: 'Получите +1 жизнь', apply() { lives++; updateLivesDisplay(); } },
  { id: 'multishot', name: 'Мультивыстрел', desc: 'При выстреле появляется дополнительный снаряд', apply() { powerups.multishotLevel++; } }
];

function getRandomPowerups() {
  const shuffled = powerupList.slice().sort(() => 0.5 - Math.random());
  return shuffled.slice(0,3);
}

function showPowerupSelection() {
  gamePaused = true;
  lastTime = performance.now(); // сброс времени при входе
  powerupOverlay.style.display = 'block';
  powerupOptionsDiv.innerHTML = '';
  confirmPowerupBtn.disabled = true;
  selectedPowerupId = null;

  const options = getRandomPowerups();

  options.forEach(pu => {
    const btn = document.createElement('button');
    btn.className = 'powerupBtn';
    btn.innerHTML = `<b>${pu.name}</b><br>${pu.desc}<br><br>Стоимость: 100 очков`;
    if(score < 100) btn.classList.add('disabled');

    btn.onclick = () => {
      if(score < 100) return;
      [...powerupOptionsDiv.children].forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedPowerupId = pu.id;
      confirmPowerupBtn.disabled = false;
    };

    powerupOptionsDiv.appendChild(btn);
  });
}

let gamePaused = false;

function shoot() {
  if(gameOver || gamePaused) return;

  const now = performance.now();
  if(now - lastShotTime < shotCooldown * powerups.shotCooldownMultiplier) return;
  lastShotTime = now;

  bullets.push({
    x: player.x + player.width/2 - 10 * powerups.bulletSizeMultiplier,
    y: player.y,
    width: 20 * powerups.bulletSizeMultiplier,
    height: 40 * powerups.bulletSizeMultiplier,
    speed: 15
  });

  for(let i = 1; i <= powerups.multishotLevel; i++) {
    const offset = 30 * i;
    bullets.push({
      x: player.x + player.width/2 - 10 * powerups.bulletSizeMultiplier - offset,
      y: player.y,
      width: 20 * powerups.bulletSizeMultiplier,
      height: 40 * powerups.bulletSizeMultiplier,
      speed: 15
    });
    bullets.push({
      x: player.x + player.width/2 - 10 * powerups.bulletSizeMultiplier + offset,
      y: player.y,
      width: 20 * powerups.bulletSizeMultiplier,
      height: 40 * powerups.bulletSizeMultiplier,
      speed: 15
    });
  }
}

function spawnEnemy() {
  if(enemies.length >= 5) return;
  const x = Math.random() * (canvas.width - enemySize);
  enemies.push({x, y: -enemySize, width: enemySize, height: enemySize, speed: 1.3 + Math.random()});
}

function update(deltaTime) {
  if(gameOver || gamePaused) return;

  if(keys['ArrowLeft'] || leftPressed) player.dx = -player.speed;
  else if(keys['ArrowRight'] || rightPressed) player.dx = player.speed;
  else player.dx = 0;

  player.x += player.dx;
  if(player.x < 0) player.x = 0;
  if(player.x + player.width > canvas.width) player.x = canvas.width - player.width;

  for(let i = bullets.length -1; i >=0; i--) {
    bullets[i].y -= bullets[i].speed;
    if(bullets[i].y + bullets[i].height < 0) bullets.splice(i, 1);
  }

  lastEnemySpawn += deltaTime;
  if(lastEnemySpawn > enemySpawnInterval) {
    spawnEnemy();
    lastEnemySpawn = 0;
    if(enemySpawnInterval > 400) enemySpawnInterval -= 15;
  }

  for(let i = enemies.length -1; i >=0; i--) {
    enemies[i].y += enemies[i].speed;

    if(enemies[i].y + enemies[i].height > player.y &&
       enemies[i].x < player.x + player.width &&
       enemies[i].x + enemies[i].width > player.x) {
      enemies.splice(i, 1);
      loseLife();
      continue;
    }

    if(enemies[i].y > canvas.height) {
      enemies.splice(i, 1);
      loseLife();
    }
  }

  for(let i = enemies.length -1; i >=0; i--) {
    for(let j = bullets.length -1; j >=0; j--) {
      if(bullets[j].x < enemies[i].x + enemies[i].width &&
         bullets[j].x + bullets[j].width > enemies[i].x &&
         bullets[j].y < enemies[i].y + enemies[i].height &&
         bullets[j].y + bullets[j].height > enemies[i].y) {
        enemies.splice(i, 1);
        bullets.splice(j, 1);
        score += 10;
        document.getElementById('score').textContent = 'Очки: ' + score;
        break;
      }
    }
  }

  if(performance.now() - lastPowerupTime > powerupInterval) {
    showPowerupSelection();
  }
}

function loseLife() {
  lives--;
  updateLivesDisplay();
  if(lives <= 0) {
    gameOver = true;
  }
}

function updateLivesDisplay() {
  const hearts = '❤'.repeat(lives);
  document.getElementById('lives').textContent = hearts;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#0f0';
  ctx.fillRect(player.x, player.y, player.width, player.height);

  ctx.fillStyle = '#ff0';
  bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

  ctx.fillStyle = '#f00';
  enemies.forEach(e => ctx.fillRect(e.x, e.y, e.width, e.height));

  if(gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = '48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('Игра окончена!', canvas.width / 2, canvas.height / 2 - 40);
    ctx.font = '24px monospace';
    ctx.fillText('Нажми кнопку Рестарт, чтобы начать заново', canvas.width / 2, canvas.height / 2 + 40);
  }
}

let lastTime = performance.now();
function gameLoop(timestamp = performance.now()) {
  if(gamePaused || gameOver) {
    lastTime = timestamp;
    if(!gameOver) requestAnimationFrame(gameLoop);
    return;
  }

  const deltaTime = timestamp - lastTime;
  lastTime = timestamp;

  update(deltaTime);
  draw();

  if(!gameOver) requestAnimationFrame(gameLoop);
}

function restartGame() {
  score = 0;
  lives = 3;
  gameOver = false;
  gamePaused = false;
  bullets.length = 0;
  enemies.length = 0;
  enemySpawnInterval = 1500;
  lastEnemySpawn = 0;
  player.x = canvas.width / 2 - player.width / 2;
  powerups = {
    bulletSizeMultiplier: 2,
    shotCooldownMultiplier: 1,
    multishotLevel: 0
  };
  lastShotTime = 0;
  lastPowerupTime = performance.now();
  updateLivesDisplay();
  document.getElementById('score').textContent = 'Очки: ' + score;
  powerupOverlay.style.display = 'none';
  gameLoop();
}

updateLivesDisplay();
gameLoop();
</script>

<script>
/* ---------- Система рекордов ---------- */
const STORAGE_KEY = 'shootGameHighscores_v1';
const MAX_SCORES = 5;

function loadScores() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw) return [];
  try {
    const arr = JSON.parse(raw);
    if(Array.isArray(arr)) return arr;
  } catch(e) {}
  return [];
}

function saveScores(arr) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(arr.slice(0, MAX_SCORES)));
  renderScores();
}

function renderScores() {
  const list = document.getElementById('scoresList');
  if(!list) return;
  list.innerHTML = '';
  const scores = loadScores();
  if(scores.length === 0) {
    const li = document.createElement('li');
    li.textContent = 'Пока нет рекордов. Будь первым!';
    list.appendChild(li);
    return;
  }
  scores.forEach((s, idx) => {
    const li = document.createElement('li');
    li.innerHTML = `<span>${idx+1}. ${escapeHtml(s.name)}</span><span>${s.score}</span>`;
    list.appendChild(li);
  });
}

function trySaveScore() {
  if(typeof score === 'undefined' || score <= 0) { renderScores(); return; }
  const scores = loadScores();
  if(scores.length < MAX_SCORES || score > scores[scores.length - 1].score) {
    let name = prompt('Отлично! Вы попали в ТОП-5. Введите имя:', 'Игрок');
    if(name === null) { renderScores(); return; }
    name = name.trim() || 'Игрок';
    scores.push({ name, score });
    scores.sort((a,b) => b.score - a.score);
    saveScores(scores);
    alert('Рекорд сохранён!');
  } else {
    renderScores();
  }
}

function clearScores() {
  if(!confirm('Сбросить все рекорды?')) return;
  localStorage.removeItem(STORAGE_KEY);
  renderScores();
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"'`=\/]/g, function (s) {
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','/':'&#x2F;','`':'&#x60;','=':'&#x3D;'})[s];
  });
}

document.getElementById('clearScoresBtn').addEventListener('click', clearScores);
renderScores();

/* Перехват окончания игры */
let _gameOverFlag = false;
setInterval(() => {
  if(!_gameOverFlag && typeof gameOver !== 'undefined' && gameOver) {
    _gameOverFlag = true;
    trySaveScore();
  }
  if(_gameOverFlag && typeof gameOver !== 'undefined' && !gameOver) {
    _gameOverFlag = false;
  }
}, 500);
/* ---------- Конец системы рекордов ---------- */
</script>

<script>
// Блокируем жест pinch-to-zoom на iOS/Android
document.addEventListener('gesturestart', function (e) {
  e.preventDefault();
});
document.addEventListener('gesturechange', function (e) {
  e.preventDefault();
});
document.addEventListener('gestureend', function (e) {
  e.preventDefault();
});
</script>
</body>
</html>
